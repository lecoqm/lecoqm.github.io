            <rect width="500" height="310" fill="url(#bike-grid)"/>
            <g fill="none" stroke="#cce2d4" stroke-width="1.5" marker-end="url(#bike-arrow)"><path d="M168 79H227"/><path d="M356 79H412V210H356"/><path d="M227 236H168"/><path d="M103 207V110"/></g>
            <g fill="#164e42" stroke="#8cae9d" stroke-width="1.2"><rect x="38" y="48" width="130" height="62" rx="8"/><rect x="227" y="48" width="130" height="62" rx="8"/><rect x="227" y="207" width="130" height="62" rx="8"/><rect x="38" y="207" width="130" height="62" rx="8"/></g>
            <g fill="#f1f3e8" font-family="system-ui, sans-serif" text-anchor="middle" font-size="14"><text x="103" y="75">Hourly data</text><text x="292" y="75">Train &amp; track</text><text x="292" y="234">Serve &amp; replay</text><text x="103" y="234">Monitor</text></g>
            <g fill="#b6d1c0" font-family="ui-monospace, monospace" text-anchor="middle" font-size="10"><text x="103" y="94">CAUSAL FEATURES</text><text x="292" y="94">MLFLOW</text><text x="292" y="253">FASTAPI</text><text x="103" y="253">ERRORS + COVERAGE</text></g>
            <g transform="translate(172 134)"><rect width="158" height="44" rx="22" fill="#dce8b8"/><text x="79" y="27" text-anchor="middle" fill="#1b453c" font-family="ui-monospace, monospace" font-size="12">compare → promote</text></g>
