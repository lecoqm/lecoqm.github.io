<svg xmlns="http://www.w3.org/2000/svg" width="500" height="310" class="project-illustration bike-illustration" viewBox="0 0 500 310" role="img" aria-labelledby="bike-diagram-title bike-diagram-desc">
            <title id="bike-diagram-title">A model inside a forecasting system</title>
